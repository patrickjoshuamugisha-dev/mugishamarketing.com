<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Barlow:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --background:0 0% 100%;
    --foreground:220 20% 10%;
    --primary:199 89% 48%;
    --primary-foreground:0 0% 100%;
    --muted-foreground:215 16% 47%;
    --border:214 32% 91%;
    --radius:.5rem;
    --gradient-hero:linear-gradient(135deg, hsl(199 89% 48%) 0%, hsl(210 100% 50%) 100%);
    --shadow-soft:0 4px 20px -4px hsl(220 20% 10% / .08);
    --shadow-hover:0 8px 30px -8px hsl(199 89% 48% / .25);
    --transition-smooth:all .3s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;border:0 solid hsl(var(--border));}
  html,body{height:100%;}
  body{
    font-family:"DM Sans",system-ui,sans-serif;
    background:hsl(var(--background));color:hsl(var(--foreground));line-height:1.6;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    display:flex;flex-direction:column;min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  nav{border-bottom:1px solid hsl(var(--border));padding:16px 0;}
  .nav-inner{max-width:1100px;margin:0 auto;padding:0 28px;display:flex;align-items:center;}
  .brand{display:flex;flex-direction:column;}
  .wm-top{font-family:'Barlow',sans-serif;font-size:22px;font-weight:800;letter-spacing:.07em;line-height:1;color:#0f0f0f;}
  .wm-bottom{display:flex;align-items:center;gap:7px;margin-top:4px;}
  .wm-rule{width:20px;height:2.5px;background:#1A6FD4;}
  .wm-sub{font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#888;}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 24px;}
  .check-icon{
    width:64px;height:64px;border-radius:50%;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;
    background:hsl(199 89% 48% / .1);color:hsl(var(--primary));border:1px solid hsl(199 89% 48% / .25);
  }
  .check-icon svg{width:30px;height:30px;}
  h1{font-size:2.2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;}
  p{color:hsl(var(--muted-foreground));font-size:1rem;max-width:440px;margin:0 auto 30px;}
  .btn-primary{
    display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;
    background:var(--gradient-hero);color:hsl(var(--primary-foreground));
    padding:12px 24px;border-radius:var(--radius);box-shadow:var(--shadow-hover);transition:var(--transition-smooth);
  }
  .btn-primary:hover{transform:translateY(-1px);}
  footer{padding:34px 0;text-align:center;border-top:1px solid hsl(var(--border));}
  footer .copy{color:hsl(var(--muted-foreground));font-size:.8rem;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="brand" aria-label="Mugisha Marketing">
      <span class="wm-top">MUGISHA</span>
      <span class="wm-bottom"><span class="wm-rule"></span><span class="wm-sub">Marketing</span></span>
    </a>
  </div>
</nav>

<main>
  <div>
    <div class="check-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Thanks for reaching out!</h1>
    <p>We'll review the details and get back to you shortly.</p>
    <a href="index.html" class="btn-primary">Back to home <span>&rarr;</span></a>
  </div>
</main>

<footer>
  <div class="copy">&copy; 2026 Mugisha Marketing. All rights reserved.</div>
</footer>

</body>
</html>
